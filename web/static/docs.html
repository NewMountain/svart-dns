<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>svart-dns API Documentation</title>
    <script type="module" src="/static/rapidoc-min.js"></script>
</head>
<body>
    <!-- load-fonts="false": otherwise RapiDoc fetches Open Sans from
         fonts.gstatic.com, leaking every docs visitor to Google (the
         admin CSP blocks it too, but the request should never be made). -->
    <rapi-doc
        spec-url="/api/openapi.json"
        theme="dark"
        bg-color="#09090b"
        text-color="#fafafa"
        primary-color="#78dce8"
        nav-bg-color="#18181b"
        nav-text-color="#a1a1aa"
        nav-hover-bg-color="#27272a"
        nav-accent-color="#78dce8"
        header-color="#18181b"
        render-style="read"
        schema-style="table"
        show-header="false"
        allow-try="true"
        load-fonts="false"
        regular-font="Inter, system-ui, sans-serif"
        mono-font="JetBrains Mono, monospace"
    ></rapi-doc>
</body>
</html>
