version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
  exclusions:
    presets: []
    warn-unused: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
